<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Downdetector Monitor — Aba de Serviço</title>
    <style>
        :root {
            --bg: #0b0d12;
            --surface: #13161e;
            --border: #1e2230;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #4f8fff;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 24px;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            display: block;
        }
        h1 {
            font-size: 18px;
            margin: 0 0 12px 0;
            font-weight: 600;
        }
        p {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.6;
            margin: 0;
        }
        .badge {
            display: inline-block;
            background: #4f8fff15;
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="icons/icon128.png" alt="Logo" class="icon">
        <div class="badge">Aba de Serviço</div>
        <h1>Downdetector Monitor</h1>
        <p>Esta aba é utilizada pela extensão para verificar o status dos serviços automaticamente. <strong>Por favor, não a feche manualmente.</strong></p>
    </div>
</body>
</html>
